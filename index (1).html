<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="M3AK - كل اللي تحتاجه.. معاك">
  <title>M3AK | معاك</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .welcome-screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      overflow: hidden;
    }

    .welcome-artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    /* منطقة الضغط على زر البدء الموجود داخل الصورة */
    .start-button-link {
      position: absolute;
      bottom: 5%;
      right: 10%;
      width: 80%;
      height: 11%;
      display: block;
      background: transparent;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .start-button-link:focus-visible {
      outline: 3px solid #7b1fa2;
      outline-offset: 4px;
      border-radius: 16px;
    }

    @media (min-width: 700px) {
      .welcome-artwork {
        width: auto;
        max-width: 100%;
        max-height: 100%;
      }

      .start-button-link {
        width: min(80%, 420px);
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>

<body>

  <main class="welcome-screen">

    <img
      class="welcome-artwork"
      src="https://raw.githubusercontent.com/hassanmody2026-maker/M3ak/main/welcome-final.png"
      alt="M3AK - كل اللي تحتاجه معاك"
      fetchpriority="high"
    >

    <a
      class="start-button-link"
      href="signup.html"
      aria-label="البدء الآن"
    ></a>

  </main>

</body>
</html>

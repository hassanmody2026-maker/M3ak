<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b0c3d">
<title>M3AK | تأكيد البريد الإلكتروني</title>

<style>
:root {
  --purple: #2b0c3d;
  --pink: #e91e63;
  --turquoise: #20c7c5;
  --text: #292333;
  --muted: #77717e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  background: #fff;
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

.logo {
  width: 82px;
  height: 82px;
  border-radius: 25px;
  margin: 0 auto 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--purple), #6b1c85);
  color: white;
  font-size: 28px;
  font-weight: bold;
  box-shadow: 0 10px 25px #2b0c3d25;
}

h1 {
  color: var(--purple);
  font-size: 25px;
  margin: 0 0 12px;
}

.description {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
  margin-bottom: 25px;
}

.email-box {
  direction: ltr;
  background: #f8f3fa;
  border: 1px solid #eadced;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 22px;
  color: var(--purple);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.primary-btn,
.secondary-btn {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 13px;
}

.primary-btn {
  color: white;
  background: linear-gradient(110deg, var(--purple), var(--pink));
  box-shadow: 0 7px 18px #7b1fa225;
}

.secondary-btn {
  color: var(--purple);
  background: #f3edf6;
}

.primary-btn:disabled,
.secondary-btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.status {
  min-height: 48px;
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.8;
}

.status.success {
  color: #16834c;
}

.status.error {
  color: #d32f2f;
}

.status.info {
  color: #65516f;
}

.footer {
  color: #999;
  font-size: 12px;
  margin-top: 30px;
}

</style>
</head>

<body>

<main class="container">

  <div class="logo">M3AK</div>

  <h1>تأكيد البريد الإلكتروني</h1>

  <p class="description">
    أرسلنا رسالة تأكيد إلى بريدك الإلكتروني.
    افتح الرسالة واضغط على رابط التأكيد،
    ثم ارجع إلى هنا لإكمال التسجيل.
  </p>

  <div class="email-box" id="emailDisplay">
    جارٍ تحميل البريد الإلكتروني...
  </div>

  <button class="primary-btn" id="verifyBtn">
    تم تأكيد البريد الإلكتروني
  </button>

  <button class="secondary-btn" id="resendBtn">
    إعادة إرسال رسالة التأكيد
  </button>

  <div class="status info" id="status">
    انتظر حتى تؤكد بريدك الإلكتروني.
  </div>

  <div class="footer">
    M3AK — كل اللي تحتاجه.. معاك
  </div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  sendEmailVerification,
  reload
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/*
  يجب استخدام نفس إعدادات Firebase
  الموجودة في signup.html
*/

const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_WEB_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_FIREBASE_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const emailDisplay = document.getElementById("emailDisplay");
const verifyBtn = document.getElementById("verifyBtn");
const resendBtn = document.getElementById("resendBtn");
const statusBox = document.getElementById("status");

let currentUser = null;

function showStatus(message, type = "info") {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

function setButtonsDisabled(disabled) {
  verifyBtn.disabled = disabled;
  resendBtn.disabled = disabled;
}

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    showStatus(
      "جلسة التسجيل غير موجودة. ارجع إلى صفحة إنشاء الحساب وابدأ التسجيل من جديد.",
      "error"
    );

    setButtonsDisabled(true);
    emailDisplay.textContent = "لا يوجد حساب قيد التحقق";
    return;
  }

  currentUser = user;
  emailDisplay.textContent = user.email || "";

  if (user.emailVerified) {
    showStatus(
      "تم تأكيد بريدك الإلكتروني بنجاح.",
      "success"
    );
  } else {
    showStatus(
      "افتح رسالة التأكيد ثم ارجع واضغط على زر التحقق.",
      "info"
    );
  }
});


verifyBtn.addEventListener("click", async () => {

  if (!currentUser) {
    showStatus("لا توجد جلسة تسجيل نشطة.", "error");
    return;
  }

  try {

    setButtonsDisabled(true);

    await reload(currentUser);

    if (!currentUser.emailVerified) {
      showStatus(
        "لم يتم تأكيد البريد حتى الآن. افتح رسالة Firebase واضغط على رابط التأكيد.",
        "error"
      );
      return;
    }

    /*
      لا نعتبر التسجيل مكتملًا بمجرد تأكيد البريد.
      يجب بعد ذلك ربط Firebase بالخادم وقاعدة البيانات.
    */

    showStatus(
      "تم تأكيد البريد بنجاح. جاري الانتقال إلى تسجيل الدخول.",
      "success"
    );

    setTimeout(() => {
      window.location.href = "./login.html";
    }, 1800);

  } catch (error) {

    console.error(error);

    showStatus(
      "تعذر التحقق حاليًا. حاول مرة أخرى.",
      "error"
    );

  } finally {
    setButtonsDisabled(false);
  }

});


resendBtn.addEventListener("click", async () => {

  if (!currentUser) {
    showStatus("لا توجد جلسة تسجيل نشطة.", "error");
    return;
  }

  try {

    setButtonsDisabled(true);

    await sendEmailVerification(currentUser);

    showStatus(
      "تم إرسال رسالة تأكيد جديدة. راجع بريدك الإلكتروني.",
      "success"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "تعذر إرسال الرسالة. انتظر قليلًا ثم حاول مرة أخرى.",
      "error"
    );

  } finally {

    setButtonsDisabled(false);

  }

});

</script>

</body>
</html>

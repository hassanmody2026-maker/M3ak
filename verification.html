<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>M3AK - التحقق من الحساب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#7100df;--deep:#430078;--pink:#ed168e;--cyan:#08bfd0;--pale:#f5eaff;--ink:#420078}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff}
    body{font-family:'Cairo',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    .page{width:100%;max-width:520px;min-height:100svh;margin:0 auto;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
    /* صورة الهوية الأصلية: الشعار والهاتف والدرع والظرف والعلامة المائية */
    .hero{display:block;width:100%;height:auto;aspect-ratio:711/635;object-fit:cover;flex:none}
    .content{position:relative;z-index:2;text-align:center;padding:0 5.5% 12px;margin-top:-1px;background:#fff}
    h1{font-size:clamp(27px,7vw,38px);line-height:1.45;font-weight:900;margin:0 0 8px;color:#410078}
    .subtitle{font-size:clamp(17px,4.5vw,23px);font-weight:700;line-height:1.8;margin:0 auto 12px;color:#410078}
    .email-line{display:flex;justify-content:center;align-items:center;gap:10px;direction:ltr;min-height:48px;margin:0 auto 15px;max-width:100%;font-size:clamp(16px,4.5vw,21px);font-weight:900;color:#4b087f;overflow-wrap:anywhere}
    .mail-icon{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#8d00ed,#ed168e);font-size:23px;box-shadow:0 5px 14px #b84aff35}
    .status{min-height:58px;border-radius:40px;background:#f5e9fc;border:1px solid #ead5f8;display:flex;align-items:center;justify-content:center;gap:9px;padding:9px 14px;margin:12px 0 22px;font-size:clamp(14px,3.8vw,18px);font-weight:800;color:#4b087f}
    .dot{width:9px;height:9px;border-radius:50%;background:#8c16d9;flex:none}
    .primary{width:100%;min-height:76px;border:0;border-radius:34px;background:linear-gradient(105deg,#8500ed 0%,#b000ce 48%,#ed168e 100%);color:#fff;font:900 clamp(22px,6vw,31px) 'Cairo',sans-serif;box-shadow:0 8px 20px #b82ce52b;cursor:pointer;padding:10px 14px}
    .primary:disabled{opacity:.65;cursor:wait}
    .resend{margin:16px 0 5px;font-size:clamp(15px,4vw,19px);font-weight:800;color:#430078}
    .resend button{font:900 inherit;border:0;background:none;color:#05b9ca;text-decoration:underline;text-underline-offset:5px;cursor:pointer;padding:4px}
    .resend button:disabled{opacity:.55;cursor:not-allowed}
    .message{min-height:27px;margin:7px 0 0;font-size:14px;font-weight:800;color:#b00070;line-height:1.7}
    .footer{display:block;width:100%;height:auto;aspect-ratio:711/256;object-fit:cover;margin-top:auto;flex:none}
    @media(max-width:360px){.content{padding-left:4%;padding-right:4%}.status{margin-bottom:16px}.primary{min-height:66px}}
    @media(min-width:521px){.page{box-shadow:0 0 35px #4a087f12}.hero{max-height:465px}.footer{max-height:188px}}
  </style>
</head>
<body>
  <main class="page">
    <img class="hero" src="verification-hero.png" alt="هوية M3AK وشعار التطبيق ورسم التحقق">

    <section class="content" aria-labelledby="title">
      <h1 id="title">التحقق من الحساب</h1>
      <p class="subtitle">أرسلنا رابط التحقق إلى بريدك الإلكتروني</p>

      <div class="email-line">
        <span class="mail-icon" aria-hidden="true">✉</span>
        <span id="emailDisplay">جارٍ تحميل البريد الإلكتروني...</span>
      </div>

      <div class="status" id="statusBox" role="status" aria-live="polite">
        <span class="dot"></span>
        <span id="statusText">في انتظار تأكيد البريد الإلكتروني</span>
      </div>

      <button class="primary" id="verifyBtn" type="button">تحققت من بريدي ✓</button>

      <div class="resend">
        لم يصلك البريد؟
        <button id="resendBtn" type="button">إعادة إرسال الرابط</button>
      </div>
      <p class="message" id="message" aria-live="polite"></p>
    </section>

    <img class="footer" src="verification-footer.png" alt="معالم مصر وألوان M3AK">
  </main>

  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, reload, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

    // ضع هنا نفس firebaseConfig الموجود حرفيًا في ملف إنشاء الحساب signup.html.
    const firebaseConfig = {
      apiKey: 'YOUR_API_KEY',
      authDomain: 'YOUR_PROJECT_ID.firebaseapp.com',
      projectId: 'YOUR_PROJECT_ID',
      storageBucket: 'YOUR_PROJECT_ID.appspot.com',
      messagingSenderId: 'YOUR_MESSAGING_SENDER_ID',
      appId: 'YOUR_APP_ID'
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const emailDisplay = document.getElementById('emailDisplay');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const statusText = document.getElementById('statusText');
    const statusBox = document.getElementById('statusBox');
    const message = document.getElementById('message');
    let user = null;
    let resendTimer = null;

    function say(text, ok=false){
      message.textContent = text;
      message.style.color = ok ? '#159b65' : '#b00070';
    }
    function maskEmail(email){
      if(!email || !email.includes('@')) return email || '';
      const [name,domain] = email.split('@');
      const visible = name.length <= 2 ? name[0] || '' : name.slice(0,2);
      return `${visible}${'*'.repeat(Math.max(3,Math.min(7,name.length-1)))}@${domain}`;
    }
    function setVerified(){
      statusText.textContent = 'تم تأكيد البريد الإلكتروني بنجاح';
      statusBox.style.background = '#eafff2';
      statusBox.style.borderColor = '#bcebd0';
      statusBox.style.color = '#16834e';
      verifyBtn.textContent = 'تم التحقق بنجاح ✓';
      verifyBtn.disabled = true;
      resendBtn.disabled = true;
      say('أهلاً بك في M3AK ❤️', true);
      // غيّر المسار فقط إذا كان اسم صفحة الدخول في مشروعك مختلفًا.
      setTimeout(() => { window.location.href = 'login.html?verified=1'; }, 1600);
    }

    onAuthStateChanged(auth, async (firebaseUser) => {
      user = firebaseUser;
      if(!user){
        emailDisplay.textContent = 'لا توجد جلسة تسجيل نشطة';
        verifyBtn.disabled = true;
        resendBtn.disabled = true;
        say('ارجع إلى إنشاء الحساب وسجّل الدخول مرة أخرى.');
        return;
      }
      emailDisplay.textContent = maskEmail(user.email);
      try {
        await reload(user);
        if(user.emailVerified) setVerified();
      } catch(error) {
        say('تعذر قراءة حالة البريد. تحقق من اتصال الإنترنت.');
      }
    });

    verifyBtn.addEventListener('click', async () => {
      if(!user) return;
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'جارٍ التحقق...';
      try {
        await reload(user);
        if(user.emailVerified){
          setVerified();
        } else {
          say('لم يتم تأكيد البريد بعد. افتح رسالة التحقق واضغط رابط التأكيد، ثم اضغط هنا.');
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'تحققت من بريدي ✓';
        }
      } catch(error) {
        say('تعذر التحقق الآن. حاول مرة أخرى.');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'تحققت من بريدي ✓';
      }
    });

    resendBtn.addEventListener('click', async () => {
      if(!user) return;
      resendBtn.disabled = true;
      try {
        await sendEmailVerification(user);
        say('تم إرسال رابط تحقق جديد. افحص الوارد والرسائل غير المرغوب فيها.', true);
        let seconds = 60;
        resendBtn.textContent = `إعادة الإرسال (${seconds})`;
        clearInterval(resendTimer);
        resendTimer = setInterval(() => {
          seconds--;
          resendBtn.textContent = seconds > 0 ? `إعادة الإرسال (${seconds})` : 'إعادة إرسال الرابط';
          if(seconds <= 0){ clearInterval(resendTimer); resendBtn.disabled = false; }
        }, 1000);
      } catch(error) {
        say('تعذر إرسال الرابط. تأكد من اتصال الإنترنت وحاول مرة أخرى.');
        resendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

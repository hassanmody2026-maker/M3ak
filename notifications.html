<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#180522">
<title>الإشعارات | M3AK</title>

<style>
:root {
  --bg:#13051d;
  --purple:#a020dc;
  --pink:#ed24b5;
  --cyan:#13d9e8;
  --gold:#ffc936;
  --white:#fff;
  --muted:#cbb3dc;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Tahoma,Arial,sans-serif;
  color:var(--white);
  background:
    radial-gradient(ellipse at 80% 0%,#480b67 0%,transparent 38%),
    linear-gradient(150deg,#190526,#100318 75%);
  min-height:100vh;
  padding-bottom:110px;
}

button {
  font-family:inherit;
  cursor:pointer;
}

.container {
  max-width:520px;
  margin:auto;
  padding:20px 16px 25px;
}

/* HEADER */

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
}

.logo {
  width:58px;
  height:58px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:39px;
  font-weight:bold;
  background:linear-gradient(140deg,#ed28e5,#6b13d9);
  box-shadow:0 0 22px #c51aff55;
}

.brand-name {
  font-size:27px;
  font-weight:900;
}

.brand-caption {
  font-size:12px;
  color:#e0c9ed;
  margin-top:4px;
}

.header-btn {
  width:48px;
  height:48px;
  border-radius:15px;
  border:1px solid #a83ad855;
  color:white;
  background:#ffffff0a;
  font-size:23px;
}

/* TITLE */

.page-title {
  margin-bottom:22px;
}

.page-title h1 {
  font-size:25px;
  margin-bottom:8px;
}

.page-title p {
  font-size:13px;
  color:var(--muted);
  line-height:1.8;
}

/* SUMMARY */

.summary {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:23px;
}

.summary-card {
  padding:17px;
  border-radius:19px;
  border:1px solid #8c35ac;
  background:linear-gradient(145deg,#351143,#210b32);
  display:flex;
  align-items:center;
  gap:12px;
}

.summary-icon {
  width:45px;
  height:45px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ed24b526;
  font-size:23px;
}

.summary-card strong {
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.summary-card small {
  font-size:11px;
  color:#d5b9e5;
}

/* ACTIONS */

.actions {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
  gap:10px;
}

.actions h2 {
  font-size:16px;
}

.action-btn {
  background:#9d20d525;
  border:1px solid #bc37e6;
  color:white;
  padding:10px 12px;
  border-radius:12px;
  font-size:10px;
}

/* FILTERS */

.filters {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:12px;
  margin-bottom:12px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar {
  display:none;
}

.filter-btn {
  flex-shrink:0;
  padding:11px 17px;
  border-radius:25px;
  background:#ffffff09;
  border:1px solid #80349b;
  color:#d7c1e5;
  font-size:12px;
}

.filter-btn.active {
  background:linear-gradient(100deg,#ed28ae,#8b0cdd);
  border-color:transparent;
  color:white;
  font-weight:bold;
}

/* NOTIFICATION CARDS */

.notifications-list {
  display:flex;
  flex-direction:column;
  gap:12px;
}

.notification-card {
  position:relative;
  display:flex;
  gap:12px;
  padding:16px 13px;
  border-radius:19px;
  border:1px solid #77308f;
  background:linear-gradient(135deg,#32103f,#210c30);
  transition:.2s;
}

.notification-card.unread {
  border-color:#bd32df;
  background:linear-gradient(135deg,#40104f,#250d35);
}

.notification-card.unread:after {
  content:"";
  position:absolute;
  right:0;
  top:15px;
  bottom:15px;
  width:3px;
  border-radius:5px;
  background:#ed24b5;
}

.notification-icon {
  width:47px;
  height:47px;
  flex-shrink:0;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:#a020dc30;
  border:1px solid #b536e7;
}

.notification-icon.cyan {
  background:#13d9e820;
  border-color:#13d9e8;
}

.notification-icon.gold {
  background:#ffc93620;
  border-color:#ffc936;
}

.notification-icon.green {
  background:#13d9a020;
  border-color:#13d9a0;
}

.notification-icon.pink {
  background:#ed24b520;
  border-color:#ed24b5;
}

.notification-content {
  flex:1;
  min-width:0;
}

.notification-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  margin-bottom:8px;
}

.notification-top h3 {
  font-size:13px;
  line-height:1.6;
}

.unread-dot {
  width:8px;
  height:8px;
  flex-shrink:0;
  border-radius:50%;
  background:#ed24b5;
}

.notification-content p {
  color:#c8afd9;
  font-size:11px;
  line-height:1.8;
  margin-bottom:9px;
}

.notification-time {
  color:#a98ab9;
  font-size:10px;
}

.notification-actions {
  display:flex;
  gap:8px;
  margin-top:11px;
  flex-wrap:wrap;
}

.small-btn {
  padding:8px 11px;
  border-radius:10px;
  border:1px solid #a93bc9;
  background:#a020dc20;
  color:white;
  font-size:10px;
}

.small-btn.delete {
  border-color:#ed458077;
  background:#ed458015;
  color:#ff9db2;
}

/* EMPTY STATE */

.empty-state {
  display:none;
  text-align:center;
  padding:40px 20px;
  border:1px dashed #8c35ac;
  border-radius:22px;
  background:#ffffff05;
}

.empty-state .icon {
  font-size:48px;
  margin-bottom:15px;
}

.empty-state h3 {
  font-size:16px;
  margin-bottom:9px;
}

.empty-state p {
  color:#c6acd7;
  font-size:12px;
  line-height:1.8;
}

/* BOTTOM NAV */

.bottom-nav {
  position:fixed;
  z-index:100;
  bottom:0;
  left:0;
  right:0;
  width:100%;
  max-width:520px;
  margin:auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:12px 4px calc(12px + env(safe-area-inset-bottom));
  background:rgba(24,5,38,.97);
  border:1px solid #6f188d;
  border-bottom:0;
  border-radius:27px 27px 0 0;
  backdrop-filter:blur(20px);
}

.nav-item {
  min-width:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  color:#b18bc9;
  font-size:10px;
  text-decoration:none;
}

.nav-icon {
  font-size:23px;
}

.nav-item.active {
  color:#f02ac2;
  font-weight:bold;
}

.nav-item.active .nav-icon {
  filter:drop-shadow(0 0 8px #ef28c5);
}

.notice {
  position:fixed;
  display:none;
  z-index:200;
  bottom:95px;
  left:15px;
  right:15px;
  max-width:480px;
  margin:auto;
  background:#351440;
  border:1px solid #c02ce2;
  border-radius:15px;
  padding:14px;
  text-align:center;
  font-size:13px;
  box-shadow:0 8px 25px #0008;
}

</style>
</head>

<body>

<main class="container">

  <header class="header">

    <div class="brand">
      <div class="logo">M</div>

      <div>
        <div class="brand-name">M3AK</div>
        <div class="brand-caption">كل اللي تحتاجه.. معاك</div>
      </div>
    </div>

    <button class="header-btn"
      onclick="showNotice('إعدادات الإشعارات سيتم تفعيلها لاحقًا')">
      ⚙
    </button>

  </header>

  <section class="page-title">
    <h1>الإشعارات</h1>
    <p>خليك دايمًا على اطلاع بكل جديد يخص حسابك وطلباتك وخدماتك.</p>
  </section>

  <!-- SUMMARY -->

  <section class="summary">

    <div class="summary-card">
      <div class="summary-icon">♧</div>
      <div>
        <strong id="totalCount">0</strong>
        <small>إجمالي الإشعارات</small>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-icon">✦</div>
      <div>
        <strong id="unreadCount">0</strong>
        <small>غير مقروءة</small>
      </div>
    </div>

  </section>

  <!-- ACTIONS -->

  <div class="actions">
    <h2>آخر التحديثات</h2>

    <button class="action-btn" onclick="markAllRead()">
      ✓ قراءة الكل
    </button>
  </div>

  <!-- FILTERS -->

  <div class="filters">

    <button class="filter-btn active"
      onclick="setFilter('all',this)">
      الكل
    </button>

    <button class="filter-btn"
      onclick="setFilter('unread',this)">
      غير مقروء
    </button>

    <button class="filter-btn"
      onclick="setFilter('orders',this)">
      الطلبات
    </button>

    <button class="filter-btn"
      onclick="setFilter('subscription',this)">
      الاشتراكات
    </button>

    <button class="filter-btn"
      onclick="setFilter('offers',this)">
      العروض
    </button>

    <button class="filter-btn"
      onclick="setFilter('security',this)">
      الأمان
    </button>

  </div>

  <!-- NOTIFICATIONS -->

  <section class="notifications-list" id="notificationsList"></section>

  <section class="empty-state" id="emptyState">
    <div class="icon">🔔</div>
    <h3>مفيش إشعارات هنا</h3>
    <p>لما يكون عندك تحديث جديد، هتلاقيه ظاهر هنا.</p>
  </section>

</main>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="home.html" class="nav-item">
    <span class="nav-icon">⌂</span>
    <span>الرئيسية</span>
  </a>

  <a href="orders.html" class="nav-item">
    <span class="nav-icon">▣</span>
    <span>طلباتي</span>
  </a>

  <a href="assistant.html" class="nav-item">
    <span class="nav-icon">✦</span>
    <span>المساعد</span>
  </a>

  <a href="notifications.html" class="nav-item active">
    <span class="nav-icon">♧</span>
    <span>الإشعارات</span>
  </a>

  <a href="profile.html" class="nav-item">
    <span class="nav-icon">●</span>
    <span>حسابي</span>
  </a>

</nav>

<div class="notice" id="notice"></div>

<script>

/*
  مركز الإشعارات جاهز من ناحية الواجهة والتفاعل.
  لا توجد إشعارات تجريبية أو بيانات وهمية.
  ستصل الإشعارات الحقيقية بعد ربط الخادم.
*/

let notifications = [];

let currentFilter = "all";

function setFilter(filter,button) {

  currentFilter = filter;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  renderNotifications();

}

function renderNotifications() {

  const list = document.getElementById("notificationsList");
  const empty = document.getElementById("emptyState");

  let filtered = notifications.filter(item => {

    if (currentFilter === "all") return true;

    if (currentFilter === "unread") return !item.read;

    return item.type === currentFilter;

  });

  list.innerHTML = "";

  filtered.forEach(item => {

    const card = document.createElement("article");

    card.className =
      "notification-card" + (item.read ? "" : " unread");

    const icon = document.createElement("div");

    icon.className =
      "notification-icon " + item.color;

    icon.textContent = item.icon;

    const content = document.createElement("div");
    content.className = "notification-content";

    const top = document.createElement("div");
    top.className = "notification-top";

    const title = document.createElement("h3");
    title.textContent = item.title;

    top.appendChild(title);

    if (!item.read) {
      const dot = document.createElement("span");
      dot.className = "unread-dot";
      top.appendChild(dot);
    }

    const message = document.createElement("p");
    message.textContent = item.message;

    const time = document.createElement("div");
    time.className = "notification-time";
    time.textContent = item.time;

    content.append(top,message,time);

    const actions = document.createElement("div");
    actions.className = "notification-actions";

    if (!item.read) {

      const readBtn = document.createElement("button");
      readBtn.className = "small-btn";
      readBtn.textContent = "تحديد كمقروء";

      readBtn.onclick = () => {
        markRead(item.id);
      };

      actions.appendChild(readBtn);

    }

    if (item.orderId) {

      const orderBtn = document.createElement("button");
      orderBtn.className = "small-btn";
      orderBtn.textContent = "متابعة الطلب";

      orderBtn.onclick = () => {
        location.href = "orders.html";
      };

      actions.appendChild(orderBtn);

    }

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "small-btn delete";
    deleteBtn.textContent = "حذف";

    deleteBtn.onclick = () => {
      deleteNotification(item.id);
    };

    actions.appendChild(deleteBtn);

    content.appendChild(actions);

    card.append(icon,content);

    list.appendChild(card);

  });

  empty.style.display =
    filtered.length ? "none" : "block";

  updateCounts();

}

function updateCounts() {

  document.getElementById("totalCount").textContent =
    notifications.length;

  document.getElementById("unreadCount").textContent =
    notifications.filter(item => !item.read).length;

}

function markRead(id) {

  notifications = notifications.map(item => {

    if (item.id === id) {
      return {...item,read:true};
    }

    return item;

  });

  renderNotifications();

}

function markAllRead() {

  notifications = notifications.map(item => ({
    ...item,
    read:true
  }));

  renderNotifications();

  showNotice("تم تحديد جميع الإشعارات كمقروءة.");

}

function deleteNotification(id) {

  notifications =
    notifications.filter(item => item.id !== id);

  renderNotifications();

  showNotice("تم حذف الإشعار من العرض الحالي.");

}

function showNotice(message) {

  const box = document.getElementById("notice");

  box.textContent = message;
  box.style.display = "block";

  clearTimeout(window.noticeTimer);

  window.noticeTimer = setTimeout(() => {
    box.style.display = "none";
  },3000);

}

renderNotifications();

</script>

</body>
</html>

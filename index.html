<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#210b32">
  <meta name="description" content="M3AK - كل اللي تحتاجه.. معاك">
  <title>M3AK | معاك</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #210b32;
      font-family: Arial, Tahoma, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .welcome-screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      max-width: 520px;
      margin: auto;
      overflow: hidden;
      background: linear-gradient(145deg, #2b0c3d, #12041a);
    }

    .welcome-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .start-button {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 7%;
      height: 8%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: transparent;
      background: transparent;
      border: 0;
      border-radius: 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .start-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    .screen-reader-text {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 521px) {
      .welcome-screen {
        box-shadow: 0 0 45px rgba(0, 0, 0, 0.4);
      }
    }
  </style>
</head>

<body>

  <main class="welcome-screen">

    <img
      class="welcome-image"
      src="welcome-final.png"
      alt="M3AK - كل اللي تحتاجه معاك"
      fetchpriority="high"
    >

    <a
      class="start-button"
      href="signup.html"
      aria-label="البدء الآن"
    >
      <span class="screen-reader-text">البدء الآن</span>
    </a>

  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاك - M3AK</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #1a0529;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 430px;
            background: #230638;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            position: relative;
            overflow-x: hidden;
            color: #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* حاوية الصورة الأصلية المدمجة بالكامل */
        .header-image-container {
            width: 100%;
            line-height: 0;
        }

        .header-image-container img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        /* شبكة الأيقونات والخدمات */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 0 5px;
            margin: 5px 0;
        }

        .service-card {
            background: linear-gradient(135deg, rgba(92, 24, 148, 0.9) 0%, rgba(53, 9, 89, 0.95) 100%);
            border: 1px solid rgba(255, 120, 220, 0.25);
            border-radius: 12px;
            padding: 8px 2px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        }

        .service-card i {
            font-size: 1.2rem;
            color: #4df3ff;
            margin-bottom: 4px;
        }

        /* ألوان الأيقونات حسب التصميم الأصلي من اليمين لليسار */
        .service-card:nth-child(1) i { color: #4df3ff; } /* حماية المستهلك */
        .service-card:nth-child(2) i { color: #5cdb95; } /* قارن الأسعار */
        .service-card:nth-child(3) i { color: #ffca3a; } /* مشتريات الأطفال */
        .service-card:nth-child(4) i { color: #ff5964; } /* فنادق ومطاعم */
        .service-card:nth-child(5) i { color: #c77dff; } /* صالونات تجميل */
        .service-card:nth-child(6) i { color: #4df3ff; } /* موبايلات */
        .service-card:nth-child(7) i { color: #ffca3a; } /* ميزانية البيت */
        .service-card:nth-child(8) i { color: #c77dff; } /* الإلكترونيات */
        .service-card:nth-child(9) i { color: #ff5964; } /* أثاث وديكور */
        .service-card:nth-child(10) i { color: #5cdb95; } /* لاندسكيب */

        .service-card span {
            font-size: 0.6rem;
            font-weight: 700;
            line-height: 1.1;
        }

        /* قسم الأزرار والأسفل */
        .action-section {
            text-align: center;
            padding: 0 5px 10px 5px;
        }

        .start-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #ff2a85 0%, #7b2cbf 100%);
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(255, 42, 133, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .start-btn i {
            background: rgba(255, 255, 255, 0.25);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.8rem;
        }

        .divider {
            margin: 8px 0;
            position: relative;
            text-align: center;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .divider span {
            background: #230638;
            padding: 0 10px;
            position: relative;
            color: #bbb;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .footer-links {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .sub-link {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sub-link i {
            color: #ff2a85;
        }

        .footer-brand-text {
            font-size: 0.72rem;
            color: #ccc;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- الهيدر باستخدام الصورة الأصلية مباشرة -->
        <div class="header-image-container">
            <img src="1000051297.png" alt="تصميم معاك">
        </div>

        <!-- شبكة الخدمات والأيقونات (مرتبة بدقة من اليمين لليسار كالنسخة الأصلية) -->
        <div class="services-grid" dir="rtl">
            <a href="#" class="service-card">
                <i class="fa-solid fa-shield-halved"></i>
                <span>حماية المستهلك</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>قارن الأسعار</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-children"></i>
                <span>مشتريات الأطفال</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-building"></i>
                <span>فنادق ومطاعم</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-scissors"></i>
                <span>صالونات تجميل</span>
            </a>

            <a href="#" class="service-card">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>موبايلات واكسسوارات</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-house-user"></i>
                <span>ميزانية البيت والأسرة</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-laptop"></i>
                <span>الإلكترونيات</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-couch"></i>
                <span>أثاث وديكور</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-seedling"></i>
                <span>لاندسكيب ونجيل صناعي</span>
            </a>
        </div>

        <!-- الأزرار والسفلية -->
        <div class="action-section">
            <a href="#" class="start-btn">
                <span>البدء الآن</span>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            
            <div class="divider">
                <span>أو</span>
            </div>

            <div class="footer-links">
                <a href="#" class="sub-link">
                    <i class="fa-solid fa-shield-check"></i>
                    الأحكام والشروط
                </a>
                <a href="#" class="sub-link">
                    <i class="fa-solid fa-lock"></i>
                    سياسة الخصوصية
                </a>
            </div>

            <div class="footer-brand-text">
                معاك ... دائمًا وأبدًا <i class="fa-solid fa-heart" style="color: #ff2a85;"></i>
            </div>
        </div>
    </div>

</body>
    </html>

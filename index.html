<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b0c3d">
<title>M3AK | معاك</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #2b0c3d;
}

body {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

#welcome {
  display: block;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  object-fit: fill;
  object-position: center;
  border: 0;
}
</style>
</head>

<body>

<img
  id="welcome"
  src="https://raw.githubusercontent.com/hassanmody2026-maker/M3ak/main/welcome-final.png?v=3"
  alt="M3AK - معاك"
>

<script>
const welcome = document.getElementById("welcome");

let fullscreenActive = false;

welcome.addEventListener("click", async function () {

  if (!fullscreenActive) {
    try {
      await document.documentElement.requestFullscreen();
      fullscreenActive = true;
    } catch (error) {
      console.log("Fullscreen غير مدعوم في المتصفح");
    }
    return;
  }

  window.location.href = "./signup.html";
});
</script>

</body>
</html>

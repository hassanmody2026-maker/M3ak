<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاك - M3AK</title>
    <!-- استيراد خط كاييرو العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #1a0529;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية الموبايل */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            background: linear-gradient(180deg, #b048d6 0%, #390a59 40%, #2b0b42 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
            color: #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* جزء الهيدر الذي يحتوي على الصورة الأصلية كاملة */
        .header-bg-section {
            width: 100%;
            height: 440px; /* ارتفاع متوافق مع جزء الصورة العلوية */
            background-image: url('1000051297.png');
            background-size: 430px auto; /* ضبط عرض الصورة لتغطي الحاوية */
            background-position: top center;
            background-repeat: no-repeat;
            position: relative;
            border-radius: 20px;
        }

        /* شبكة الأيقونات (الخدمات) */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 10px 0;
        }

        .service-card {
            background: linear-gradient(135deg, rgba(82, 20, 131, 0.85) 0%, rgba(50, 8, 85, 0.9) 100%);
            border: 1px solid rgba(255, 120, 220, 0.3);
            border-radius: 14px;
            padding: 10px 2px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .service-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 42, 133, 0.8);
        }

        .service-card i {
            font-size: 1.3rem;
            color: #4df3ff;
            margin-bottom: 6px;
        }

        /* تلوين بعض الأيقونات لتشبه التصميم */
        .service-card:nth-child(2) i { color: #5cdb95; }
        .service-card:nth-child(3) i { color: #ffca3a; }
        .service-card:nth-child(4) i { color: #ff5964; }
        .service-card:nth-child(5) i { color: #c77dff; }
        .service-card:nth-child(6) i { color: #4df3ff; }
        .service-card:nth-child(7) i { color: #ffca3a; }
        .service-card:nth-child(8) i { color: #5cdb95; }
        .service-card:nth-child(9) i { color: #ff5964; }
        .service-card:nth-child(10) i { color: #70c1b3; }

        .service-card span {
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1.2;
        }

        /* قسم الأزرار والروابط في الأسفل */
        .action-section {
            text-align: center;
            margin-top: 5px;
        }

        .start-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #ff2a85 0%, #7b2cbf 100%);
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .start-btn i {
            background: rgba(255, 255, 255, 0.25);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.85rem;
        }

        .divider {
            margin: 10px 0;
            position: relative;
            text-align: center;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
        }

        .divider span {
            background: #2b0b42;
            padding: 0 15px;
            position: relative;
            color: #d1d1d1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .footer-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .sub-link {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(5px);
        }

        .sub-link i {
            color: #ff2a85;
        }

        .footer-brand-text {
            font-size: 0.75rem;
            color: #ddd;
            font-weight: 600;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- الجزء العلوي المعتمِد على الصورة الأصلية بالكامل -->
        <div class="header-bg-section"></div>

        <!-- شبكة الأيقونات والخدمات (10 خدمات مطابقة) -->
        <div class="services-grid">
            <a href="#" class="service-card">
                <i class="fa-solid fa-shield-halved"></i>
                <span>حماية المستهلك</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>قارن الأسعار</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-children"></i>
                <span>مشتريات الأطفال</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-building"></i>
                <span>فنادق ومطاعم</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-scissors"></i>
                <span>صالونات تجميل</span>
            </a>

            <a href="#" class="service-card">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>موبايلات واكسسوارات</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-house-user"></i>
                <span>ميزانية البيت والأسرة</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-laptop"></i>
                <span>الإلكترونيات</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-couch"></i>
                <span>أثاث وديكور</span>
            </a>
            <a href="#" class="service-card">
                <i class="fa-solid fa-seedling"></i>
                <span>لاندسكيب ونجيل صناعي</span>
            </a>
        </div>

        <!-- قسم الأزرار والأسفل -->
        <div class="action-section">
            <a href="#" class="start-btn">
                <span>البدء الآن</span>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            
            <div class="divider">
                <span>أو</span>
            </div>

            <div class="footer-links">
                <a href="#" class="sub-link">
                    <i class="fa-solid fa-shield-check"></i>
                    الأحكام والشروط
                </a>
                <a href="#" class="sub-link">
                    <i class="fa-solid fa-lock"></i>
                    سياسة الخصوصية
                </a>
            </div>

            <div class="footer-brand-text">
                معاك ... دائمًا وأبدًا <i class="fa-solid fa-heart" style="color: #ff2a85;"></i>
            </div>
        </div>
    </div>

</body>
  </html>

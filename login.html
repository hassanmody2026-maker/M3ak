<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>تسجيل الدخول | M3AK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --purple:#2b0c3d;
    --primary:#7b1fa2;
    --pink:#e91e63;
    --turquoise:#20b8b2;
    --text:#30243a;
    --muted:#89818f;
    --border:#eadff0;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    font-family:'Cairo',sans-serif;
    background:#fff;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

.page {
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    padding:35px 25px 25px;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
}

.watermark {
    position:absolute;
    width:370px;
    height:370px;
    top:35%;
    left:50%;
    transform:translate(-50%,-50%);
    opacity:.035;
    pointer-events:none;
    z-index:0;
}

.content {
    position:relative;
    z-index:1;
    width:100%;
}

.logo {
    text-align:center;
    margin-bottom:30px;
}

.logo-icon {
    width:88px;
    height:88px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:27px;
    background:linear-gradient(145deg,#7b1fa2,#e91e63);
    box-shadow:0 12px 28px rgba(123,31,162,.20);
}

.logo-icon svg {
    width:58px;
    height:58px;
}

.logo h1 {
    color:var(--purple);
    font-size:32px;
    font-weight:900;
    margin-top:8px;
}

.logo p {
    font-size:13px;
    color:var(--muted);
    font-weight:600;
}

.heading {
    text-align:center;
    margin-bottom:30px;
}

.heading h2 {
    color:var(--purple);
    font-size:25px;
    font-weight:900;
    margin-bottom:7px;
}

.heading p {
    font-size:13px;
    color:var(--muted);
    line-height:1.9;
}

.field {
    margin-bottom:19px;
}

.field label {
    display:block;
    font-size:13px;
    font-weight:800;
    color:var(--purple);
    margin-bottom:9px;
}

.input-box {
    height:57px;
    border:1px solid var(--border);
    border-radius:15px;
    background:rgba(255,255,255,.96);
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:12px;
    transition:.25s;
}

.input-box:focus-within {
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(123,31,162,.08);
}

.input-box svg {
    width:21px;
    height:21px;
    stroke:var(--primary);
    flex-shrink:0;
}

.input-box input {
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:13px;
    color:var(--text);
}

.input-box input::placeholder {
    color:#b0a7b7;
}

.eye {
    cursor:pointer;
    border:none;
    background:none;
    display:flex;
}

.options {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:4px 0 25px;
    font-size:12px;
}

.remember {
    display:flex;
    align-items:center;
    gap:7px;
    color:#716879;
}

.remember input {
    accent-color:var(--primary);
    width:16px;
    height:16px;
}

a {
    text-decoration:none;
    color:var(--primary);
    font-weight:700;
}

.login-btn {
    width:100%;
    height:57px;
    border:none;
    border-radius:16px;
    background:linear-gradient(110deg,#7b1fa2,#e91e63);
    color:white;
    font-family:inherit;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 9px 22px rgba(123,31,162,.20);
    transition:.25s;
}

.login-btn:active {
    transform:scale(.98);
}

.login-btn:disabled {
    opacity:.65;
    cursor:not-allowed;
}

.message {
    display:none;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:12px;
    text-align:center;
}

.message.error {
    display:block;
    background:#fff0f2;
    color:#c62848;
}

.message.success {
    display:block;
    background:#e9f8f5;
    color:#16877d;
}

.signup {
    text-align:center;
    margin-top:27px;
    font-size:13px;
    color:#817987;
}

.signup a {
    font-weight:900;
}

.divider {
    height:1px;
    background:linear-gradient(to right,transparent,#e9deed,transparent);
    margin-top:28px;
}

.footer {
    text-align:center;
    margin-top:22px;
    font-size:11px;
    color:#aaa1ae;
}

.footer span {
    color:var(--turquoise);
    font-weight:800;
}

@media(max-height:700px) {
    .page {
        padding-top:20px;
        justify-content:flex-start;
    }

    .logo {
        margin-bottom:18px;
    }

    .logo-icon {
        width:65px;
        height:65px;
    }

    .heading {
        margin-bottom:20px;
    }
}
</style>
</head>

<body>

<main class="page">

<!-- العلامة المائية -->
<svg class="watermark" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg">
    <path d="M55 190 L200 65 L345 190 V345 H55 Z"
          fill="none" stroke="#7b1fa2"
          stroke-width="15" stroke-linejoin="round"/>
    <path d="M200 265
             C130 215 125 165 165 150
             C185 142 200 158 200 158
             C200 158 220 142 240 150
             C280 165 270 215 200 265Z"
          fill="none" stroke="#e91e63"
          stroke-width="13"/>
</svg>

<div class="content">

    <!-- الشعار -->
    <header class="logo">

        <div class="logo-icon">
            <svg viewBox="0 0 100 100" fill="none">
                <path d="M12 46 L50 13 L88 46"
                      stroke="white" stroke-width="7"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

                <path d="M23 42 V83 H77 V42"
                      stroke="white" stroke-width="7"
                      stroke-linejoin="round"/>

                <path d="M50 70
                         C34 59 33 48 43 45
                         C48 43 50 48 50 48
                         C50 48 54 43 59 45
                         C69 48 66 59 50 70Z"
                      fill="#20b8b2"/>
            </svg>
        </div>

        <h1>معاك</h1>
        <p>M3AK – كل احتياجاتك معاك</p>

    </header>

    <!-- عنوان الشاشة -->
    <section class="heading">
        <h2>أهلاً بعودتك ❤️</h2>
        <p>
            سجّل دخولك واستمتع بكل خدمات معاك
            في مكان واحد.
        </p>
    </section>

    <!-- نموذج الدخول -->
    <form id="loginForm" autocomplete="on">

        <div class="field">
            <label for="identity">
                البريد الإلكتروني أو رقم الهاتف
            </label>

            <div class="input-box">

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <rect x="3" y="5" width="18" height="14" rx="3"/>
                    <path d="M4 7 L12 13 L20 7"/>
                </svg>

                <input
                    id="identity"
                    name="identity"
                    type="text"
                    placeholder="أدخل بريدك أو رقم هاتفك"
                    autocomplete="username"
                    required>
            </div>
        </div>

        <div class="field">

            <label for="password">كلمة المرور</label>

            <div class="input-box">

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <rect x="4" y="10" width="16" height="11" rx="3"/>
                    <path d="M8 10 V7 A4 4 0 0 1 16 7 V10"/>
                </svg>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required>

                <button type="button" class="eye"
                        id="togglePassword"
                        aria-label="إظهار كلمة المرور">

                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="#7b1fa2" stroke-width="1.8">
                        <path d="M2 12 S6 5 12 5 S22 12 22 12 S18 19 12 19 S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                </button>

            </div>
        </div>

        <div class="options">

            <label class="remember">
                <input type="checkbox" id="remember">
                تذكرني
            </label>

            <a href="verify.html?mode=reset">
                نسيت كلمة المرور؟
            </a>

        </div>

        <div id="message" class="message"
             role="alert" aria-live="polite"></div>

        <button class="login-btn" id="loginButton"
                type="submit">
            تسجيل الدخول
        </button>

    </form>

    <div class="signup">
        ليس لديك حساب؟
        <a href="signup.html">أنشئ حسابًا جديدًا</a>
    </div>

    <div class="divider"></div>

    <footer class="footer">
        معاك في كل خطوة
        <br>
        <span>M3AK</span>
        © جميع الحقوق محفوظة
    </footer>

</div>
</main>

<script>
(() => {
    "use strict";

    const API_BASE =
        (window.M3AK_API_BASE || "/api").replace(/\/+$/, "");

    const form = document.getElementById("loginForm");
    const identity = document.getElementById("identity");
    const password = document.getElementById("password");
    const remember = document.getElementById("remember");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    document.getElementById("togglePassword")
        .addEventListener("click", () => {
            password.type =
                password.type === "password"
                ? "text"
                : "password";
        });

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const loginIdentity = identity.value.trim();
        const loginPassword = password.value;

        if (!loginIdentity || !loginPassword) {
            showMessage("من فضلك أدخل بيانات تسجيل الدخول.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "جارٍ التحقق...";
        message.className = "message";

        try {

            const response = await fetch(
                `${API_BASE}/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        identity: loginIdentity,
                        password: loginPassword,
                        remember: remember.checked
                    })
                }
            );

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    data.error ||
                    "تعذر تسجيل الدخول. راجع بياناتك وحاول مرة أخرى."
                );
            }

            if (data.success === false) {
                throw new Error(
                    data.message || "بيانات الدخول غير صحيحة."
                );
            }

            if (data.requiresVerification ||
                data.emailVerified === false) {

                window.location.href = "verify.html";
                return;
            }

            if (data.requiresTrialActivation) {
                window.location.href = "trial.html";
                return;
            }

            if (data.subscriptionExpired) {
                window.location.href = "subscriptions.html";
                return;
            }

            showMessage("تم تسجيل الدخول بنجاح.", "success");

            button.textContent = "تم الدخول بنجاح";

            setTimeout(() => {
                window.location.href = "home.html";
            }, 500);

        } catch (error) {

            showMessage(
                error.message || "حدث خطأ أثناء تسجيل الدخول.",
                "error"
            );

            button.disabled = false;
            button.textContent = "تسجيل الدخول";
        }
    });

})();
</script>

</body>
</html>

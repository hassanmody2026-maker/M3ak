<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7414a8">
<title>معاك | المساعد الذكي</title>
<style>
:root{--purple:#7414a8;--deep:#481078;--pink:#ed1597;--turquoise:#12bfc4;--ink:#351044;--muted:#806b8d;--pale:#f8f4ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--pale);color:var(--ink)}
body{display:flex;justify-content:center}
.app{position:relative;width:min(100%,470px);min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#fff;box-shadow:0 0 32px #48107718}
.header{height:112px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;padding:12px 18px;background:linear-gradient(110deg,#fff 0%,#fbf5ff 55%,#fff 100%);border-bottom:1px solid #f0e5fb}
.header:before,.header:after{content:"";position:absolute;width:80px;height:80px;border:8px solid #f4e9fc;border-radius:24px;transform:rotate(45deg);opacity:.75}
.header:before{right:22px}.header:after{left:22px}
.brand{position:relative;z-index:1;text-align:center;line-height:1.2}
.brand h1{margin:0;color:var(--purple);font-size:38px;font-weight:900;letter-spacing:-1.5px}
.brand p{margin:4px 0 0;font-size:15px;font-weight:800;color:var(--deep)}
.brand-line{width:116px;height:5px;border-radius:8px;margin:8px auto 0;background:linear-gradient(90deg,var(--turquoise),var(--pink),var(--purple))}
.bell{position:absolute;z-index:2;right:14px;top:18px;width:43px;height:43px;border-radius:50%;border:1px solid #e5d1f6;background:#f7efff;color:var(--purple);display:grid;place-items:center}
.bell svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2}
.brand-logo{position:absolute;left:13px;top:13px;width:57px;height:57px;display:grid;place-items:center}
.brand-logo svg{width:56px;height:56px}
.welcome{margin:12px 13px 0;min-height:78px;padding:10px 13px;border:1px solid #eadbfa;border-radius:20px;background:linear-gradient(110deg,#fff,#f8efff);display:flex;align-items:center;gap:12px;box-shadow:0 3px 10px #7414a81a}
.avatar{width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f2ddff,#fff);border:2px solid #e5c9fb;font-size:34px}
.welcome-copy{border-right:3px solid #7d1ab0;padding-right:12px;line-height:1.6}
.welcome-copy strong{display:block;color:var(--deep);font-size:16px}
.welcome-copy span{display:block;color:#6c3c84;font-size:12px;font-weight:700}
.hero{margin:12px 13px 0;border-radius:22px;overflow:hidden;box-shadow:0 5px 14px #7414a833;line-height:0}
.hero img{display:block;width:100%;height:auto}
.section-title{display:flex;align-items:center;gap:10px;margin:15px 20px 7px;color:var(--deep);font-size:20px;font-weight:900;line-height:1.3}
.section-title:before,.section-title:after{content:"";height:3px;flex:1;border-radius:4px;background:linear-gradient(90deg,#e7c8ff,var(--purple),#e7c8ff)}
.chat-area{flex:1;min-height:190px;margin:0 13px 8px;padding:12px 11px;border:1px solid #eadcf7;border-radius:20px;background:radial-gradient(circle at 90% 5%,#fbf2ff 0,transparent 33%),#fff;overflow:auto;display:flex;flex-direction:column;gap:11px;box-shadow:inset 0 0 18px #f7efff}
.message{display:flex;align-items:flex-end;gap:7px;max-width:90%;line-height:1.65}
.botmsg{align-self:flex-start}.usermsg{align-self:flex-end;flex-direction:row-reverse}
.mini-bot{width:29px;height:29px;flex:none;border-radius:10px;background:#f1e4fc;display:grid;place-items:center;font-size:18px}
.bubble{padding:9px 12px;border-radius:16px;font-size:12px;box-shadow:0 2px 7px #4d17600d}
.botmsg .bubble{background:#f7f0ff;border:1px solid #ead8fa;border-bottom-right-radius:5px}
.usermsg .bubble{background:linear-gradient(120deg,#7414a8,#a51db6);color:#fff;border-bottom-left-radius:5px}
.time{display:block;font-size:9px;opacity:.62;margin-top:3px;text-align:left}
.suggestions{padding:0 13px;margin:0 0 8px}
.suggestions-title{font-size:11px;color:var(--muted);font-weight:700;margin:0 3px 7px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 5px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #e5d2f5;border-radius:18px;background:#fff;color:var(--purple);padding:8px 11px;font:700 11px Tahoma;box-shadow:0 2px 7px #7414a810;cursor:pointer}
.composer-wrap{padding:9px 13px 10px;background:#fff;border-top:1px solid #f1e8f8}
.composer{display:flex;align-items:center;gap:7px;padding:6px 7px;border:1.5px solid #e5d3f4;border-radius:18px;background:#fff;box-shadow:0 3px 12px #7414a811}
.action{width:39px;height:39px;flex:none;border:0;border-radius:13px;display:grid;place-items:center;cursor:pointer}
.attach{background:#f5edfc;color:var(--purple)}.send{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#prompt{width:100%;min-width:0;border:0;outline:0;background:transparent;font:13px Tahoma;color:var(--ink);text-align:right}
#prompt::placeholder{color:#a18eaa}
.disclaimer{text-align:center;font-size:9px;color:#9b8aa2;margin:6px 0 0;line-height:1.5}
.bottom-nav{height:76px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #eadcf6;background:#fff;box-shadow:0 -4px 14px #6c1b9810;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#806b8d;font-size:10px;font-weight:800;position:relative}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--purple)}
.nav-item.active:before{content:"";position:absolute;top:0;left:16%;right:16%;height:3px;border-radius:0 0 5px 5px;background:linear-gradient(90deg,var(--pink),var(--purple))}
.toast{position:fixed;z-index:5;left:50%;bottom:90px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#321044;color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;line-height:1.5;transition:.2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:18px 0}.app{min-height:calc(100dvh - 36px);border-radius:24px}}
</style>
</head>

<div class="section-title">اتكلم مع مساعدك الذكي</div>
<section class="chat-area" id="chat" aria-live="polite">
  <div class="message botmsg"><div class="mini-bot">🤖</div><div class="bubble">أهلاً بيك! 👋<br>أنا مساعدك الذكي في معاك. تحب أساعدك في إيه النهارده؟<span class="time">الآن</span></div></div>
</section>
<section class="suggestions">
  <div class="suggestions-title">ممكن تسألني عن:</div>
  <div class="chips">
    <button class="chip" data-q="ساعدني أختار منتج مناسب">🛍️ اختيار المنتجات</button>
    <button class="chip" data-q="عايز أعرف الخدمات القريبة مني">📍 خدمات قريبة</button>
    <button class="chip" data-q="ساعدني أنظم احتياجات البيت">🏠 احتياجات المنزل</button>
    <button class="chip" data-q="عايز نصيحة للأسرة والأطفال">👨‍👩‍👧 الأسرة والأطفال</button>
  </div>
</section>
<section class="composer-wrap">
  <form class="composer" id="chatForm">
    <button class="action attach" type="button" aria-label="إرفاق صورة" id="attach"><svg viewBox="0 0 24 24"><path d="m21 11.5-8.8 8.8a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.9 1.9 0 0 1-2.6-2.6l8.5-8.5"/></svg></button>
    <input id="prompt" type="text" autocomplete="off" placeholder="اكتب سؤالك هنا..." aria-label="اكتب سؤالك">
    <button class="action send" type="submit" aria-label="إرسال"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
  </form>
  <p class="disclaimer">قد يقدّم المساعد الذكي معلومات تحتاج إلى مراجعة أو تحقق.</p>
  <input type="file" id="imageInput" accept="image/*" hidden>
</section>

<div class="toast" id="toast"></div>
<script>
const chat=document.getElementById('chat'), promptInput=document.getElementById('prompt'), toast=document.getElementById('toast');
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300)}
function addMessage(text,isUser){const row=document.createElement('div');row.className='message '+(isUser?'usermsg':'botmsg');if(!isUser){const icon=document.createElement('div');icon.className='mini-bot';icon.textContent='🤖';row.appendChild(icon)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;const time=document.createElement('span');time.className='time';time.textContent='الآن';bubble.appendChild(time);row.appendChild(bubble);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();const value=promptInput.value.trim();if(!value)return;addMessage(value,true);promptInput.value='';setTimeout(()=>addMessage('وصلني سؤالك. ربط الردود الذكية يحتاج توصيل واجهة المساعد بخدمة الذكاء الاصطناعي من الخادم.',false),450)});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{promptInput.value=b.dataset.q;promptInput.focus()}));
document.getElementById('attach').addEventListener('click',()=>document.getElementById('imageInput').click());
document.getElementById('imageInput').addEventListener('change',e=>{if(e.target.files.length)showToast('تم اختيار الصورة. يلزم ربط تحليل الصور بالخادم.')});
document.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();showToast('التنقل إلى '+a.dataset.nav+' يحتاج ربط مسارات التطبيق.')}));
</script>

<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

:root {
  --purple:#54258f;
  --deep:#35145f;
  --pink:#e94c9b;
  --teal:#35bdb4;
  --ink:#29233a;
  --muted:#827b91;
  --bg:#f7f5fb;
  --line:#eee9f4;
  --white:#fff;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  font-family:Tahoma,Arial,sans-serif;
  color:var(--ink);
  min-height:100dvh;
}

button,input {
  font-family:inherit;
}

.app {
  max-width:480px;
  margin:auto;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  box-shadow:0 0 35px #2c17400d;
}

/* HEADER */

.top {
  background:linear-gradient(
    135deg,
    var(--deep),
    var(--purple) 65%,
    #7543ad
  );
  color:white;
  padding:18px 18px 22px;
  border-radius:0 0 25px 25px;
  box-shadow:0 8px 24px #54258f25;
}

.toprow {
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
}

.logo {
  width:48px;
  height:48px;
  border-radius:15px;
  background:linear-gradient(145deg,#fff,#f7dff0);
  display:grid;
  place-items:center;
  color:var(--purple);
  font-weight:900;
  font-size:25px;
  box-shadow:inset 0 0 0 2px #ffffff70;
}

.brand strong {
  font-size:20px;
  letter-spacing:.4px;
}

.brand small {
  display:block;
  color:#e9dff5;
  font-size:11px;
  margin-top:4px;
}

.iconbtn {
  border:1px solid #ffffff40;
  background:#ffffff18;
  color:#fff;
  width:42px;
  height:42px;
  border-radius:14px;
  font-size:20px;
  cursor:pointer;
}

.title {
  margin:21px 0 5px;
  font-size:23px;
}

.subtitle {
  font-size:12px;
  color:#eee5f7;
  line-height:1.9;
}

/* USAGE CARD */

.status {
  margin-top:17px;
  background:#ffffff18;
  border:1px solid #ffffff2b;
  border-radius:15px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:11px;
}

.status b {
  color:#fff;
}

.status-info {
  opacity:.85;
  margin-top:5px;
  line-height:1.6;
}

.usage-number {
  font-weight:bold;
  color:#fff;
  white-space:nowrap;
}

.meter {
  height:6px;
  width:78px;
  background:#ffffff45;
  border-radius:9px;
  overflow:hidden;
  margin-top:7px;
}

.meter i {
  display:block;
  width:35%;
  height:100%;
  background:#72e0d5;
  border-radius:9px;
}

/* CONTENT */

.content {
  padding:18px 16px 14px;
  flex:1;
}

.welcome {
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  display:flex;
  gap:12px;
  align-items:center;
  box-shadow:0 5px 18px #34204d08;
}

.bot {
  width:52px;
  height:52px;
  flex:none;
  border-radius:17px;
  background:linear-gradient(145deg,#e8e0fb,#d5f5f1);
  display:grid;
  place-items:center;
  font-size:27px;
}

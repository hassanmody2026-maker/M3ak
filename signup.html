<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>إنشاء الحساب | M3AK</title>

<style>
:root {
  --purple: #542078;
  --deep-purple: #321044;
  --pink: #e91e63;
  --teal: #00aeb5;
  --text: #30243a;
  --muted: #81778a;
  --border: #e8e0ed;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #ffffff;
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  direction: rtl;
}

button, input {
  font-family: inherit;
}

.page {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  padding: 18px 20px 35px;
  position: relative;
  overflow: hidden;
  background: #ffffff;
}

/* خلفية بيضاء مع علامة مائية خفيفة */
.watermark {
  position: fixed;
  inset: 0;
  max-width: 520px;
  margin: auto;
  pointer-events: none;
  opacity: .035;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 0;
}

.watermark svg {
  width: 340px;
  height: 340px;
}

/* الشريط العلوي */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  position: relative;
  z-index: 2;
  margin-bottom: 28px;
}

.back-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  color: var(--purple);
  font-size: 25px;
  cursor: pointer;
  box-shadow: 0 3px 12px rgba(60, 20, 80, .06);
}

.page-title {
  margin: 9px 0 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--deep-purple);
  text-align: left;
  flex: 1;
  padding-left: 10px;
}

.brand {
  text-align: center;
  min-width: 85px;
}

.brand-logo {
  width: 47px;
  height: 42px;
  margin: auto;
}

.brand-name {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(110deg, var(--purple), var(--pink), var(--teal));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.1;
}

.brand-caption {
  font-size: 8px;
  color: var(--muted);
  margin-top: 3px;
}

/* مقدمة الشاشة */
.intro {
  text-align: center;
  position: relative;
  z-index: 1;
  margin-bottom: 25px;
}

.user-icon {
  width: 68px;
  height: 68px;
  border-radius: 23px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  background: linear-gradient(140deg, var(--purple), var(--pink));
  box-shadow: 0 9px 22px rgba(126, 31, 151, .18);
  position: relative;
}

.user-icon svg {
  width: 35px;
  height: 35px;
}

.user-icon::after {
  content: "+";
  position: absolute;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--teal);
  color: white;
  border: 3px solid white;
  left: -7px;
  bottom: -5px;
  font-size: 19px;
  font-weight: bold;
  line-height: 20px;
}

.intro h1 {
  color: var(--deep-purple);
  font-size: 25px;
  margin: 0 0 8px;
  font-weight: 900;
}

.intro p {
  color: var(--muted);
  font-size: 13px;
  margin: 0;
  line-height: 1.8;
}

/* النموذج */
.form-area {
  position: relative;
  z-index: 1;
}

.field {
  margin-bottom: 13px;
}

.field-box {
  min-height: 55px;
  border: 1px solid var(--border);
  border-radius: 15px;
  display: flex;
  align-items: center;
  background: #ffffff;
  padding: 0 14px;
  transition: .2s ease;
  box-shadow: 0 3px 12px rgba(50, 16, 68, .035);
}

.field-box:focus-within {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(0, 174, 181, .09);
}

.field-icon {
  width: 23px;
  height: 23px;
  color: var(--purple);
  flex-shrink: 0;
  margin-left: 12px;
}

.field input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  min-width: 0;
  color: var(--text);
  font-size: 14px;
  padding: 15px 0;
}

.field input::placeholder {
  color: #a49aaa;
}

.password-toggle {
  border: none;
  background: transparent;
  color: #8c7b98;
  font-size: 19px;
  cursor: pointer;
  padding: 5px;
}

/* الهاتف */
.phone-box {
  display: flex;
  align-items: center;
  direction: ltr;
}

.phone-box input {
  direction: rtl;
  text-align: right;
}

.country-code {
  display: flex;
  align-items: center;
  gap: 7px;
  padding-right: 10px;
  margin-right: 10px;
  border-right: 1px solid var(--border);
  color: var(--purple);
  font-size: 13px;
  white-space: nowrap;
  font-weight: bold;
}

.egypt-flag {
  font-size: 19px;
}

/* الموافقات */
.agreements {
  margin: 18px 3px 20px;
}

.agreement {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 12px 0;
  font-size: 12px;
  color: #62576b;
  line-height: 1.7;
}

.agreement input {
  appearance: none;
  width: 19px;
  height: 19px;
  min-width: 19px;
  border: 1.5px solid #c9bdd2;
  border-radius: 5px;
  cursor: pointer;
  position: relative;
  margin: 0;
}

.agreement input:checked {
  background: var(--teal);
  border-color: var(--teal);
}

.agreement input:checked::after {
  content: "✓";
  color: white;
  position: absolute;
  top: -1px;
  right: 3px;
  font-weight: bold;
  font-size: 14px;
}

.agreement a {
  color: var(--teal);
  font-weight: bold;
  text-decoration: none;
}

/* زر إنشاء الحساب */
.submit-button {
  width: 100%;
  min-height: 56px;
  border: none;
  border-radius: 17px;
  color: white;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  background: linear-gradient(105deg, var(--pink), var(--purple), var(--teal));
  box-shadow: 0 8px 20px rgba(126, 31, 151, .19);
  transition: transform .2s ease, opacity .2s ease;
}

.submit-button:active {
  transform: scale(.98);
}

.submit-button:disabled {
  opacity: .65;
  cursor: wait;
}

.message {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  font-size: 12px;
  line-height: 1.7;
}

.message.error {
  display: block;
  color: #a32145;
  background: #fff0f4;
  border: 1px solid #ffd4e0;
}

.message.success {
  display: block;
  color: #087b69;
  background: #eafaf6;
  border: 1px solid #c8eee5;
}

/* رابط تسجيل الدخول */
.login-link {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin: 19px 0;
}

.login-link a {
  color: var(--teal);
  text-decoration: none;
  font-weight: 900;
}

/* التجربة المجانية */
.trial-box {
  border: 1px solid #eadcf3;
  background: linear-gradient(110deg, #faf4ff, #f0fcfc);
  border-radius: 16px;
  padding: 14px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 17px;
}

.trial-icon {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: linear-gradient(140deg, var(--purple), var(--pink));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  flex-shrink: 0;
}

.trial-text strong {
  display: block;
  font-size: 14px;
  color: var(--deep-purple);
  margin-bottom: 4px;
}

.trial-text strong span {
  color: var(--pink);
}

.trial-text small {
  color: var(--muted);
  font-size: 11px;
}

/* العبارة السفلية */
.footer {
  text-align: center;
  color: #988da0;
  font-size: 11px;
  margin-top: 22px;
  padding-bottom: 8px;
}

.footer span {
  color: var(--pink);
}

/* الشاشات الصغيرة */
@media (max-width: 360px) {
  .page {
    padding: 14px 14px 28px;
  }

  .intro h1 {
    font-size: 22px;
  }

  .field-box {
    min-height: 52px;
  }

  .page-title {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="watermark" aria-hidden="true">
    <svg viewBox="0 0 300 300" fill="none">
      <path d="M45 145 L150 55 L255 145 V250 H45 Z"
            stroke="#542078" stroke-width="13" stroke-linejoin="round"/>
      <path d="M105 250 V180 Q150 125 195 180 V250"
            stroke="#e91e63" stroke-width="12"/>
      <path d="M150 130 C115 95 85 130 150 185 C215 130 185 95 150 130Z"
            fill="#00aeb5"/>
    </svg>
  </div>

  <header class="topbar">

    <button class="back-button" type="button"
      aria-label="رجوع" onclick="goBack()">‹</button>

    <h2 class="page-title">إنشاء الحساب</h2>

    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 100 85" fill="none">
        <path d="M12 42 L50 9 L88 42"
          stroke="#7b1fa2" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 39 V76 H77 V39"
          stroke="#e91e63" stroke-width="8"
          stroke-linejoin="round"/>
        <path d="M50 37 C35 25 25 41 50 59 C75 41 65 25 50 37Z"
          fill="#00aeb5"/>
        <path d="M13 65 Q29 81 45 70"
          stroke="#7b1fa2" stroke-width="6"
          stroke-linecap="round"/>
        <path d="M87 65 Q71 81 55 70"
          stroke="#e91e63" stroke-width="6"
          stroke-linecap="round"/>
      </svg>
      <div class="brand-name">M3AK</div>
      <div class="brand-caption">كل اللي تحتاجه.. معاك</div>
    </div>

  </header>

  <section class="intro">

    <div class="user-icon">
      <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21 C4 16 7 14 12 14 C17 14 20 16 20 21"/>
      </svg>
    </div>

    <h1>أنشئ حسابك الآن</h1>
    <p>واستمتع بكل خدمات معاك</p>

  </section>

  <main class="form-area">

    <form id="signupForm" novalidate>

      <div class="field">
        <div class="field-box">
          <svg class="field-icon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21 C4 16 7 14 12 14 C17 14 20 16 20 21"/>
          </svg>
          <input id="fullName" type="text"
            placeholder="الاسم بالكامل"
            autocomplete="name" required>
        </div>
      </div>

      <div class="field">
        <div class="field-box">
          <svg class="field-icon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <path d="M4 7 L12 13 L20 7"/>
          </svg>
          <input id="email" type="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <div class="field-box phone-box">

          <input id="phone" type="tel"
            placeholder="رقم الهاتف"
            autocomplete="tel-national"
            inputmode="tel" required>

          <div class="country-code">
            <span class="egypt-flag">🇪🇬</span>
            <span>+20</span>
          </div>

        </div>
      </div>

      <div class="field">
        <div class="field-box">
          <svg class="field-icon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10 V7 A4 4 0 0 1 16 7 V10"/>
          </svg>
          <input id="password" type="password"
            placeholder="كلمة المرور"
            autocomplete="new-password" required>
          <button class="password-toggle" type="button"
            onclick="togglePassword('password', this)"
            aria-label="إظهار كلمة المرور">◉</button>
        </div>
      </div>

      <div class="field">
        <div class="field-box">
          <svg class="field-icon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10 V7 A4 4 0 0 1 16 7 V10"/>
          </svg>
          <input id="confirmPassword" type="password"
            placeholder="تأكيد كلمة المرور"
            autocomplete="new-password" required>
          <button class="password-toggle" type="button"
            onclick="togglePassword('confirmPassword', this)"
            aria-label="إظهار تأكيد كلمة المرور">◉</button>
        </div>
      </div>

      <div class="agreements">

        <label class="agreement">
          <input id="agreeTerms" type="checkbox" required>
          <span>
            أوافق على
            <a href="terms.html">الشروط والأحكام</a>
          </span>
        </label>

        <label class="agreement">
          <input id="agreePrivacy" type="checkbox" required>
          <span>
            أوافق على
            <a href="privacy.html">سياسة الخصوصية</a>
          </span>
        </label>

      </div>

      <button class="submit-button" id="submitButton" type="submit">
        إنشاء الحساب
      </button>

      <div id="formMessage" class="message" role="alert"></div>

    </form>

    <div class="login-link">
      لديك حساب بالفعل؟
      <a href="login.html">تسجيل الدخول</a>
    </div>

    <div class="trial-box">

      <div class="trial-icon">✓</div>

      <div class="trial-text">
        <strong>تجربة مجانية لمدة <span>7 أيام</span></strong>
        <small>لجميع خدمات M3AK</small>
      </div>

    </div>

  </main>

  <footer class="footer">
    معاك <span>♥</span> في كل خطوة
  </footer>

</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification
} from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/*
  ضع بيانات Firebase الحقيقية الخاصة بمشروع M3AK هنا.
  لا تضع مفاتيح الخادم السرية داخل هذا الملف.
*/
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_FIREBASE_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("signupForm");
const submitButton = document.getElementById("submitButton");
const messageBox = document.getElementById("formMessage");

function showMessage(message, type = "error") {
  messageBox.textContent = message;
  messageBox.className = "message " + type;
}

function normalizeEmail(value) {
  return value.trim().toLowerCase();
}

function normalizePhone(value) {
  let digits = value.replace(/\D/g, "");

  if (digits.startsWith("20")) {
    digits = digits.substring(2);
  }

  if (digits.startsWith("0")) {
    digits = digits.substring(1);
  }

  return "+20" + digits;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  messageBox.className = "message";
  messageBox.textContent = "";

  const name = document.getElementById("fullName").value.trim();
  const email = normalizeEmail(
    document.getElementById("email").value
  );
  const phoneInput = document.getElementById("phone").value.trim();
  const phone = normalizePhone(phoneInput);
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const agreedTerms =
    document.getElementById("agreeTerms").checked;

  const agreedPrivacy =
    document.getElementById("agreePrivacy").checked;

  if (!name || !email || !phoneInput || !password || !confirmPassword) {
    showMessage("من فضلك أكمل جميع البيانات المطلوبة.");
    return;
  }

  if (name.length < 3) {
    showMessage("الاسم بالكامل يجب ألا يقل عن 3 أحرف.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMessage("من فضلك أدخل بريدًا إلكترونيًا صحيحًا.");
    return;
  }

  if (!/^(\+20)[0-9]{10}$/.test(phone)) {
    showMessage("أدخل رقم هاتف مصري صحيحًا مكونًا من 10 أرقام بعد كود الدولة.");
    return;
  }

  if (password.length < 8) {
    showMessage("كلمة المرور يجب ألا تقل عن 8 أحرف.");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("كلمتا المرور غير متطابقتين.");
    return;
  }

  if (!agreedTerms || !agreedPrivacy) {
    showMessage("يجب الموافقة على الشروط والأحكام وسياسة الخصوصية.");
    return;
  }

  if (
    firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY" ||
    firebaseConfig.projectId === "YOUR_PROJECT_ID"
  ) {
    showMessage("إعدادات Firebase غير مكتملة. يجب ربط بيانات المشروع الحقيقية أولاً.");
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "جارٍ إنشاء الحساب...";

  try {
    const credential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await sendEmailVerification(credential.user);

    const pendingSignup = {
      name,
      email,
      phone,
      agreedTerms: true,
      agreedPrivacy: true,
      createdAt: new Date().toISOString()
    };

    sessionStorage.setItem(
      "m3ak_pending_signup",
      JSON.stringify(pendingSignup)
    );

    showMessage(
      "تم إنشاء الحساب. أرسلنا رسالة تأكيد إلى بريدك الإلكتروني. انتقل إلى صفحة التحقق لإكمال التسجيل.",
      "success"
    );

    setTimeout(() => {
      window.location.href = "verification.html";
    }, 1200);

  } catch (error) {
    let errorMessage = "تعذر إنشاء الحساب. حاول مرة أخرى.";

    if (error.code === "auth/email-already-in-use") {
      errorMessage = "هذا البريد الإلكتروني مسجل بالفعل. يمكنك تسجيل الدخول.";
    } else if (error.code === "auth/invalid-email") {
      errorMessage = "البريد الإلكتروني غير صحيح.";
    } else if (error.code === "auth/weak-password") {
      errorMessage = "كلمة المرور ضعيفة. استخدم كلمة مرور أقوى.";
    } else if (error.code === "auth/network-request-failed") {
      errorMessage = "تعذر الاتصال بالإنترنت. تحقق من اتصالك وحاول مجددًا.";
    } else if (error.code === "auth/operation-not-allowed") {
      errorMessage = "تسجيل البريد وكلمة المرور غير مفعل في إعدادات Firebase.";
    }

    showMessage(errorMessage);

  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "إنشاء الحساب";
  }
});

window.togglePassword = function(id, button) {
  const input = document.getElementById(id);

  if (input.type === "password") {
    input.type = "text";
    button.textContent = "◎";
  } else {
    input.type = "password";
    button.textContent = "◉";
  }
};

window.goBack = function() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "index.html";
  }
};
</script>

</body>
    </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b0c3d">
<title>إنشاء حساب جديد | M3AK</title>

<style>
:root {
  --purple:#2b0c3d;
  --purple2:#421052;
  --pink:#e91e63;
  --teal:#18b6b0;
  --text:#261b2c;
  --muted:#817687;
  --border:#eee7f1;
  --white:#fff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff;
  color:var(--text);
}
body{
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:82px;
}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
.page{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#fff;
}
.header{
  min-height:190px;
  padding:22px 20px 45px;
  text-align:center;
  color:#fff;
  background:linear-gradient(135deg,#421052,#2b0c3d 65%,#180522);
  border-radius:0 0 34px 34px;
  position:relative;
  overflow:hidden;
}
.header:before{
  content:"";
  position:absolute;
  width:230px;height:230px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  top:-130px;right:-60px;
}
.header:after{
  content:"";
  position:absolute;
  width:180px;height:180px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:50%;
  bottom:-130px;left:-50px;
}
.brand{
  position:relative;
  z-index:2;
}
.logo{
  width:54px;height:54px;
  margin:0 auto 7px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:29px;
  color:#fff;
  background:linear-gradient(145deg,var(--pink),#8124a0);
  box-shadow:0 5px 22px #0003;
}
.brand h1{
  margin:0;
  font-size:30px;
  letter-spacing:2px;
  font-weight:900;
}
.brand p{
  margin:5px 0 0;
  font-size:13px;
  color:#f4e9f8;
}
.header-accent{
  position:absolute;
  bottom:0;right:0;
  width:42%;height:5px;
  background:var(--pink);
}
.header-accent:after{
  content:"";
  display:block;
  width:55%;height:5px;
  background:var(--teal);
}
.content{
  position:relative;
  padding:0 20px 25px;
  margin-top:-24px;
  z-index:2;
}
.form-card{
  background:rgba(255,255,255,.97);
  border:1px solid #f0e9f3;
  border-radius:25px;
  padding:23px 18px;
  box-shadow:0 12px 35px rgba(43,12,61,.09);
  position:relative;
  overflow:hidden;
}
.form-card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.045;
  background-image:url("https://raw.githubusercontent.com/hassanmody2026-maker/M3ak/main/welcome-final.png");
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}
.form-inner{position:relative;z-index:1}
.title{text-align:center;margin-bottom:21px}
.title-icon{
  width:48px;height:48px;
  margin:0 auto 10px;
  display:grid;place-items:center;
  border-radius:16px;
  color:var(--purple);
  background:#f5eafa;
  font-size:24px;
}
.title h2{
  margin:0;
  color:var(--purple);
  font-size:21px;
}
.title p{
  color:var(--muted);
  font-size:12px;
  margin:8px 0 0;
}
.field{margin-bottom:14px}
.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;
  height:49px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  padding:0 43px 0 48px;
  outline:none;
  color:var(--text);
  transition:.2s;
}
.input-wrap input:focus{
  border-color:var(--purple2);
  box-shadow:0 0 0 3px #42105212;
}
.input-icon{
  position:absolute;
  right:14px;top:50%;
  transform:translateY(-50%);
  color:#8c6b99;
  font-size:17px;
}
.toggle{
  position:absolute;
  left:10px;top:50%;
  transform:translateY(-50%);
  border:0;background:none;
  color:var(--purple2);
  font-size:11px;
  cursor:pointer;
}
.phone-row{
  display:flex;
  gap:8px;
}
.phone-row .input-wrap{flex:1}
.country-code{
  min-width:83px;
  height:49px;
  border:1px solid var(--border);
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:var(--purple);
  background:#fff;
  font-size:13px;
  font-weight:bold;
}
.check-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin:13px 0;
  font-size:12px;
  line-height:1.8;
  color:#594d60;
}
.check-row input{
  accent-color:var(--purple);
  width:17px;height:17px;
  margin-top:3px;
  flex-shrink:0;
}
a{color:#67318a;text-decoration:none;font-weight:bold}
.submit{
  width:100%;
  height:52px;
  border:0;
  border-radius:15px;
  margin-top:10px;
  color:#fff;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(100deg,#e91e63,#a51b83);
  box-shadow:0 8px 20px #e91e632e;
}
.submit:disabled{opacity:.6;cursor:wait}
.login-line{
  text-align:center;
  font-size:12px;
  margin:17px 0 5px;
  color:var(--muted);
}
.trial{
  margin-top:17px;
  border:1px solid #e8dff0;
  border-radius:15px;
  padding:13px 10px;
  text-align:center;
  background:linear-gradient(100deg,#fbf5ff,#f2fffe);
  color:var(--purple);
  font-size:13px;
  font-weight:bold;
  line-height:1.8;
}
.trial strong{color:var(--pink);font-size:18px}
.notice{
  display:none;
  padding:11px 12px;
  border-radius:12px;
  font-size:12px;
  line-height:1.7;
  margin-bottom:14px;
}
.notice.error{display:block;background:#fff0f1;color:#a51e35}
.notice.success{display:block;background:#eafaf4;color:#14734d}
.notice.info{display:block;background:#f4effa;color:#54236d}
.bottom-nav{
  position:fixed;
  z-index:10;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:100%;max-width:520px;
  min-height:70px;
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:var(--purple);
  border-radius:19px 19px 0 0;
  box-shadow:0 -5px 22px #2b0c3d18;
}
.nav-item{
  color:#fff;
  text-align:center;
  font-size:10px;
  line-height:1.5;
  opacity:.9;
  min-width:54px;
}
.nav-item span{display:block;font-size:20px}
.nav-item.active{color:#ff65a0}
.assistant span{
  width:39px;height:39px;
  margin:-19px auto 1px;
  display:grid;place-items:center;
  border-radius:50%;
  background:linear-gradient(140deg,var(--pink),#7b1fa2);
  border:3px solid var(--purple);
  font-size:19px;
}
@media(max-width:360px){
  .content{padding-left:13px;padding-right:13px}
  .form-card{padding:19px 13px}
  .header{min-height:175px}
}
</style>
</head>

<body>
<main class="page">

<header class="header">
  <div class="brand">
    <div class="logo">♥</div>
    <h1>M3AK</h1>
    <p>كل اللي تحتاجه.. معاك</p>
  </div>
  <div class="header-accent"></div>
</header>

<section class="content">
  <div class="form-card">
    <div class="form-inner">

      <div class="title">
        <div class="title-icon">♙</div>
        <h2>إنشاء حساب جديد</h2>
        <p>انضم إلى عائلة M3AK وابدأ رحلتك معنا</p>
      </div>

      <div id="notice" class="notice" role="alert"></div>

      <form id="signupForm" autocomplete="on">

        <div class="field">
          <label for="fullName">الاسم بالكامل</label>
          <div class="input-wrap">
            <span class="input-icon">♙</span>
            <input id="fullName" name="name" type="text"
              placeholder="اكتب اسمك بالكامل" maxlength="100"
              autocomplete="name" required>
          </div>
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input id="email" name="email" type="email"
              placeholder="example@email.com"
              autocomplete="email" dir="ltr" required>
          </div>
        </div>

        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <div class="phone-row">
            <div class="country-code">🇪🇬 +20</div>
            <div class="input-wrap">
              <span class="input-icon">☎</span>
              <input id="phone" name="phone" type="tel"
                placeholder="رقم الهاتف"
                autocomplete="tel" inputmode="tel"
                maxlength="20" required>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <span class="input-icon">♙</span>
            <input id="password" name="password" type="password"
              placeholder="8 أحرف على الأقل"
              minlength="8" autocomplete="new-password" required>
            <button class="toggle" type="button" data-target="password">إظهار</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <div class="input-wrap">
            <span class="input-icon">♙</span>
            <input id="confirmPassword" type="password"
              placeholder="أعد كتابة كلمة المرور"
              minlength="8" autocomplete="new-password" required>
            <button class="toggle" type="button" data-target="confirmPassword">إظهار</button>
          </div>
        </div>

        <label class="check-row">
          <input id="agreeTerms" type="checkbox" required>
          <span>أوافق على <a href="terms.html" target="_blank">الشروط والأحكام</a>.</span>
        </label>

        <label class="check-row">
          <input id="agreePrivacy" type="checkbox" required>
          <span>أوافق على <a href="privacy.html" target="_blank">سياسة الخصوصية</a>.</span>
        </label>

        <button class="submit" id="submitBtn" type="submit">
          إنشاء الحساب
        </button>

      </form>

      <p class="login-line">
        لديك حساب بالفعل؟
        <a href="login.html">تسجيل الدخول</a>
      </p>

      <div class="trial">
        🎁 تجربة مجانية لمدة <strong>7 أيام</strong><br>
        لجميع خدمات M3AK
      </div>

    </div>
  </div>
</section>

<nav class="bottom-nav" aria-label="التنقل الرئيسي">
  <a class="nav-item" href="index.html"><span>⌂</span>الرئيسية</a>
  <a class="nav-item" href="home.html"><span>▦</span>الأقسام</a>
  <a class="nav-item assistant" href="login.html"><span>✦</span>المساعد الذكي</a>
  <a class="nav-item" href="login.html"><span>🛍</span>الطلبات</a>
  <a class="nav-item" href="login.html"><span>♙</span>حسابي</a>
</nav>

</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/*
  إعدادات الربط:
  ضع بيانات Firebase Web App الحقيقية هنا.
  لا تضع مفاتيح Firebase Admin أو أسرار الخادم في هذا الملف.
*/
const FIREBASE_CONFIG = {
  apiKey: "YOUR_FIREBASE_WEB_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_FIREBASE_APP_ID"
};

/*
  ضع عنوان الخادم المنشور، بدون / في النهاية.
  مثال: https://api.your-domain.com
*/
const API_BASE = "https://YOUR-BACKEND-DOMAIN";

const form = document.getElementById("signupForm");
const notice = document.getElementById("notice");
const submitBtn = document.getElementById("submitBtn");

function showNotice(message, type="error") {
  notice.className = "notice " + type;
  notice.textContent = message;
  notice.scrollIntoView({behavior:"smooth",block:"nearest"});
}

document.querySelectorAll(".toggle").forEach(button => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.target);
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    button.textContent = showing ? "إظهار" : "إخفاء";
  });
});

function normalizePhone(value) {
  return value.replace(/[^\d+]/g,"").trim();
}

function friendlyFirebaseError(code) {
  const messages = {
    "auth/email-already-in-use":"هذا البريد الإلكتروني مسجل بالفعل.",
    "auth/invalid-email":"صيغة البريد الإلكتروني غير صحيحة.",
    "auth/weak-password":"كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.",
    "auth/operation-not-allowed":"تسجيل البريد الإلكتروني غير مفعل في Firebase.",
    "auth/network-request-failed":"تعذر الاتصال. تحقق من الإنترنت وحاول مجدداً."
  };
  return messages[code] || "تعذر بدء التسجيل. حاول مرة أخرى.";
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  notice.className = "notice";
  notice.textContent = "";

  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phoneInput = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const agreedTerms = document.getElementById("agreeTerms").checked;
  const agreedPrivacy = document.getElementById("agreePrivacy").checked;

  if (!name || !email || !phoneInput || !password || !confirmPassword) {
    showNotice("من فضلك أكمل جميع البيانات.");
    return;
  }

  if (password.length < 8) {
    showNotice("كلمة المرور يجب ألا تقل عن 8 أحرف.");
    return;
  }

  if (password !== confirmPassword) {
    showNotice("كلمتا المرور غير متطابقتين.");
    return;
  }

  if (!agreedTerms || !agreedPrivacy) {
    showNotice("يجب الموافقة على الشروط وسياسة الخصوصية للمتابعة.");
    return;
  }

  if (FIREBASE_CONFIG.apiKey.startsWith("YOUR_") ||
      API_BASE.includes("YOUR-BACKEND")) {
    showNotice("إعدادات Firebase وعنوان الخادم لم تُضف بعد. لن يتم إنشاء حساب وهمي.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "جارٍ تجهيز التحقق من البريد...";

  try {
    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    const credential = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await sendEmailVerification(credential.user, {
      url: new URL("verification.html", window.location.href).href,
      handleCodeInApp: false
    });

    /*
      بيانات مؤقتة في sessionStorage فقط حتى إتمام التحقق.
      لا تُحفظ كلمة المرور في Local Storage.
      صفحة verification.html ستكمل التسجيل مع الخادم بعد تأكيد البريد.
    */
    sessionStorage.setItem("m3ak_pending_registration", JSON.stringify({
      name,
      email,
      phone: normalizePhone(phoneInput),
      password,
      agreedTerms,
      agreedPrivacy,
      createdAt: Date.now()
    }));

    showNotice(
      "أرسلنا رسالة تحقق إلى بريدك الإلكتروني. افتح الرسالة واضغط رابط التفعيل، ثم ارجع للتطبيق لإكمال إنشاء حسابك.",
      "success"
    );

    submitBtn.textContent = "تم إرسال رسالة التحقق";

  } catch (error) {
    console.error("M3AK signup error:", error);
    showNotice(friendlyFirebaseError(error.code));
    submitBtn.disabled = false;
    submitBtn.textContent = "إنشاء الحساب";
  }
});
</script>

</body>
</html>

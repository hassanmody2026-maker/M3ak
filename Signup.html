<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b0c3d">
<title>إنشاء حساب جديد | M3AK</title>

<style>
:root {
  --purple:#2b0c3d;
  --purple2:#542078;
  --pink:#e91e63;
  --turquoise:#35c6bd;
  --text:#291737;
  --muted:#82768d;
  --white:#ffffff;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Tahoma,Arial,sans-serif;
  background:#f8f5fb;
  color:var(--text);
  min-height:100vh;
}

button,input,select {
  font-family:inherit;
}

.page {
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding-bottom:95px;
  background:#fff;
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header {
  background:linear-gradient(145deg,#2b0c3d,#542078);
  color:white;
  text-align:center;
  padding:25px 18px 35px;
  position:relative;
  border-radius:0 0 35px 35px;
  overflow:hidden;
}

.header:before {
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border:1px solid #ffffff18;
  border-radius:50%;
  top:-120px;
  right:-70px;
}

.header:after {
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid #ffffff18;
  border-radius:50%;
  bottom:-125px;
  left:-65px;
}

.back {
  position:absolute;
  top:18px;
  left:18px;
  width:38px;
  height:38px;
  border:1px solid #ffffff40;
  border-radius:50%;
  color:white;
  background:#ffffff15;
  font-size:20px;
  cursor:pointer;
}

.logo {
  width:75px;
  height:75px;
  margin:5px auto 8px;
  border-radius:23px;
  background:linear-gradient(145deg,#7b1fa2,#e91e63);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px #0003;
}

.logo svg {
  width:55px;
  height:55px;
}

.brand {
  font-size:32px;
  font-weight:900;
  letter-spacing:2px;
}

.slogan {
  font-size:13px;
  margin-top:6px;
  color:#f1e5fa;
}

.color-line {
  width:95px;
  height:4px;
  margin:15px auto 0;
  border-radius:10px;
  background:linear-gradient(90deg,var(--turquoise),var(--pink));
}

/* FORM */

.content {
  padding:25px 22px 20px;
}

.title {
  text-align:center;
  margin-bottom:23px;
}

.title-icon {
  width:53px;
  height:53px;
  margin:auto;
  border-radius:17px;
  background:#f5eafa;
  color:var(--purple2);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
}

.title h1 {
  font-size:23px;
  color:var(--purple);
  margin:13px 0 7px;
}

.title p {
  color:var(--muted);
  font-size:12px;
}

/* INPUTS */

.form-group {
  margin-bottom:15px;
}

.form-group label {
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
  color:#493558;
}

.input-box {
  display:flex;
  align-items:center;
  border:1px solid #e9e1ef;
  background:#fcfaff;
  border-radius:13px;
  min-height:49px;
  padding:0 12px;
  transition:.2s;
}

.input-box:focus-within {
  border-color:var(--purple2);
  box-shadow:0 0 0 3px #54207812;
}

.input-icon {
  color:var(--purple2);
  font-size:19px;
  width:30px;
  flex-shrink:0;
  text-align:center;
}

.input-box input {
  border:0;
  outline:0;
  background:transparent;
  width:100%;
  height:47px;
  font-size:13px;
  color:var(--text);
  min-width:0;
}

.input-box input::placeholder {
  color:#b3a9bd;
}

.password-toggle {
  border:0;
  background:transparent;
  color:var(--purple2);
  cursor:pointer;
  font-size:11px;
  padding:8px 3px;
}

/* PHONE */

.phone-row {
  display:flex;
  gap:7px;
  width:100%;
}

.phone-row select {
  width:105px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--purple);
  font-weight:bold;
  font-size:12px;
}

.phone-row input {
  direction:ltr;
  text-align:right;
}

/* CHECKBOXES */

.checks {
  margin:20px 0;
}

.check-row {
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin-bottom:12px;
  font-size:12px;
  line-height:1.8;
  color:#675970;
}

.check-row input {
  width:17px;
  height:17px;
  margin-top:3px;
  accent-color:var(--purple2);
  flex-shrink:0;
}

.check-row a {
  color:#287cb9;
  font-weight:bold;
  text-decoration:none;
}

/* TRIAL */

.trial {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:linear-gradient(100deg,#f5eafa,#eafaf8);
  border:1px solid #eee3f4;
  border-radius:15px;
  margin:18px 0;
}

.trial-icon {
  width:42px;
  height:42px;
  border-radius:13px;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--purple2);
  font-size:22px;
  flex-shrink:0;
}

.trial strong {
  display:block;
  font-size:13px;
  color:var(--purple);
  margin-bottom:5px;
}

.trial span {
  display:block;
  font-size:11px;
  color:var(--muted);
}

/* BUTTON */

.submit {
  width:100%;
  height:53px;
  border:0;
  border-radius:15px;
  color:white;
  font-size:15px;
  font-weight:bold;
  background:linear-gradient(100deg,#7b1fa2,#e91e63);
  box-shadow:0 8px 20px #e91e6330;
  cursor:pointer;
  transition:.2s;
}

.submit:active {
  transform:scale(.98);
}

.submit:disabled {
  opacity:.65;
  cursor:not-allowed;
}

.login {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:20px;
}

.login a {
  color:var(--purple2);
  font-weight:bold;
  text-decoration:none;
}

.message {
  display:none;
  margin-top:13px;
  padding:12px;
  border-radius:11px;
  font-size:12px;
  line-height:1.8;
}

.message.error {
  display:block;
  color:#a3224d;
  background:#fff0f4;
}

.message.success {
  display:block;
  color:#147d69;
  background:#eafaf5;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  height:75px;
  background:#2b0c3d;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
  box-shadow:0 -5px 20px #2b0c3d18;
}

.nav-item {
  color:#ffffffb8;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
  flex:1;
}

.nav-item .icon {
  font-size:20px;
}

.nav-item.active {
  color:#ffffff;
}

.nav-item.ai .icon {
  width:43px;
  height:43px;
  margin-top:-22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#e91e63,#8e24aa);
  box-shadow:0 0 0 5px #2b0c3d,0 0 18px #e91e6370;
  font-size:22px;
}

@media(max-width:380px) {
  .content {
    padding:22px 16px;
  }

  .title h1 {
    font-size:21px;
  }
}
</style>
</head>

<body>

<main class="page">

<header class="header">

<button class="back" type="button"
onclick="history.back()" aria-label="رجوع">‹</button>

<div class="logo">
<svg viewBox="0 0 64 64" fill="none">
<path d="M8 29L32 9L56 29V55H8V29Z"
stroke="white" stroke-width="3.5"
stroke-linejoin="round"/>
<path d="M22 55V37H42V55"
stroke="white" stroke-width="3"/>
<path d="M32 31C23 21 15 32 23 40L32 47L41 40C49 32 41 21 32 31Z"
fill="#ff9dcc"/>
<path d="M5 44C13 40 18 44 23 49M59 44C51 40 46 44 41 49"
stroke="#55ddd1" stroke-width="3"
stroke-linecap="round"/>
</svg>
</div>

<div class="brand">M3AK</div>
<div class="slogan">كل اللي تحتاجه.. معاك</div>
<div class="color-line"></div>

</header>

<section class="content">

<div class="title">
<div class="title-icon">♙</div>
<h1>إنشاء حساب جديد</h1>
<p>انضم إلى عائلة M3AK وابدأ تجربتك معنا</p>
</div>

<form id="signupForm">

<div class="form-group">
<label for="fullName">الاسم بالكامل</label>
<div class="input-box">
<span class="input-icon">♙</span>
<input id="fullName" type="text"
placeholder="اكتب اسمك بالكامل"
autocomplete="name" required>
</div>
</div>

<div class="form-group">
<label for="email">البريد الإلكتروني</label>
<div class="input-box">
<span class="input-icon">✉</span>
<input id="email" type="email"
placeholder="example@email.com"
dir="ltr" autocomplete="email" required>
</div>
</div>

<div class="form-group">
<label for="phone">رقم الهاتف</label>
<div class="input-box">
<span class="input-icon">☎</span>
<div class="phone-row">
<select id="countryCode">
<option value="+20">🇪🇬 +20</option>
<option value="+966">🇸🇦 +966</option>
<option value="+971">🇦🇪 +971</option>
<option value="+965">🇰🇼 +965</option>
<option value="+974">🇶🇦 +974</option>
<option value="+962">🇯🇴 +962</option>
<option value="+212">🇲🇦 +212</option>
</select>
<input id="phone" type="tel"
placeholder="رقم الهاتف"
autocomplete="tel-national"
required>
</div>
</div>
</div>

<div class="form-group">
<label for="password">كلمة المرور</label>
<div class="input-box">
<span class="input-icon">🔒</span>
<input id="password" type="password"
placeholder="8 أحرف على الأقل"
minlength="8" required>
<button class="password-toggle"
type="button" data-target="password">إظهار</button>
</div>
</div>

<div class="form-group">
<label for="confirmPassword">تأكيد كلمة المرور</label>
<div class="input-box">
<span class="input-icon">🔒</span>
<input id="confirmPassword" type="password"
placeholder="أعد كتابة كلمة المرور"
minlength="8" required>
<button class="password-toggle"
type="button" data-target="confirmPassword">إظهار</button>
</div>
</div>

<div class="checks">

<label class="check-row">
<input id="agreeTerms" type="checkbox" required>
<span>أوافق على
<a href="terms.html" target="_blank">الشروط والأحكام</a>
</span>
</label>

<label class="check-row">
<input id="agreePrivacy" type="checkbox" required>
<span>وأقر باطلاعي على
<a href="privacy.html" target="_blank">سياسة الخصوصية</a>
</span>
</label>

</div>

<div class="trial">
<div class="trial-icon">♛</div>
<div>
<strong>7 أيام تجربة مجانية</strong>
<span>لجميع خدمات M3AK وفق حدود الاستخدام المقررة.</span>
</div>
</div>

<button class="submit" id="submitButton" type="submit">
إنشاء الحساب
</button>

<div class="message" id="formMessage" role="alert"></div>

</form>

<p class="login">
لديك حساب بالفعل؟
<a href="login.html">تسجيل الدخول</a>
</p>

</section>

</main>

<nav class="bottom-nav">

<a href="index.html" class="nav-item">
<span class="icon">⌂</span>
<span>الرئيسية</span>
</a>

<a href="sections.html" class="nav-item">
<span class="icon">▦</span>
<span>الأقسام</span>
</a>

<a href="assistant.html" class="nav-item ai">
<span class="icon">✧</span>
<span>المساعد الذكي</span>
</a>

<a href="orders.html" class="nav-item">
<span class="icon">🛒</span>
<span>الطلبات</span>
</a>

<a href="profile.html" class="nav-item">
<span class="icon">♙</span>
<span>الملف الشخصي</span>
</a>

</nav>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/*
  ضع بيانات مشروع Firebase الفعلية هنا.
*/
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_FIREBASE_APP_ID"
};

const API_BASE = "/api";

const form = document.getElementById("signupForm");
const message = document.getElementById("formMessage");
const submitButton = document.getElementById("submitButton");

function showMessage(text,type="error") {
  message.textContent = text;
  message.className = "message " + type;
}

document.querySelectorAll(".password-toggle").forEach(button=>{
  button.addEventListener("click",()=>{
    const input = document.getElementById(button.dataset.target);
    const visible = input.type === "password";
    input.type = visible ? "text" : "password";
    button.textContent = visible ? "إخفاء" : "إظهار";
  });
});

form.addEventListener("submit",async event=>{

  event.preventDefault();

  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phoneNumber = document.getElementById("phone").value.trim();
  const countryCode = document.getElementById("countryCode").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(password.length < 8) {
    showMessage("كلمة المرور يجب ألا تقل عن 8 أحرف.");
    return;
  }

  if(password !== confirmPassword) {
    showMessage("كلمتا المرور غير متطابقتين.");
    return;
  }

  if(!document.getElementById("agreeTerms").checked ||
     !document.getElementById("agreePrivacy").checked) {
    showMessage("يجب الموافقة على الشروط وسياسة الخصوصية.");
    return;
  }

  if(!phoneNumber) {
    showMessage("يرجى إدخال رقم الهاتف.");
    return;
  }

  if(firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY") {
    showMessage("إعدادات Firebase غير مكتملة. يجب إضافة بيانات المشروع الفعلية.");
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "جارٍ إنشاء الحساب...";

  try {

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const credential = await createUserWithEmailAndPassword(
      auth,email,password
    );

    await credential.user.reload();

    await sendEmailVerification(credential.user,{
      url: window.location.origin + "/verification.html",
      handleCodeInApp: true
    });

    /*
      بيانات التسجيل المؤقتة حتى إتمام التحقق.
      لا يتم إنشاء سجل المستخدم في قاعدة البيانات هنا.
    */
    sessionStorage.setItem("m3ak_pending_signup",JSON.stringify({
      name,
      email,
      phone:countryCode + phoneNumber,
      password,
      agreedTerms:true,
      agreedPrivacy:true
    }));

    showMessage(
      "تم إنشاء حساب المصادقة. أرسلنا رسالة تحقق إلى بريدك الإلكتروني. انتقل إلى صفحة التحقق لإكمال التسجيل.",
      "success"
    );

    setTimeout(()=>{
      window.location.href = "verification.html";
    },1800);

  } catch(error) {

    const errors = {
      "auth/email-already-in-use":"هذا البريد الإلكتروني مسجل بالفعل.",
      "auth/invalid-email":"البريد الإلكتروني غير صحيح.",
      "auth/weak-password":"كلمة المرور ضعيفة.",
      "auth/network-request-failed":"تعذر الاتصال بالإنترنت.",
      "auth/too-many-requests":"محاولات كثيرة. حاول لاحقًا."
    };

    showMessage(
      errors[error.code] || "تعذر إنشاء الحساب: " + error.message
    );

  } finally {

    submitButton.disabled = false;
    submitButton.textContent = "إنشاء الحساب";

  }

});

</script>

</body>
  </html>
